<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151515">
<title>ISRL · Semana de la Matemática</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#dcd8cc;--acc:#151515;--fl:#ee961a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS",Verdana,sans-serif}
header{padding:22px 20px 10px;max-width:1100px;margin:auto}
h1{margin:0;font-size:1.7rem;letter-spacing:-.5px}
#estado{font-size:.85rem;color:var(--mut)}
main{max-width:1100px;margin:auto;padding:0 20px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}
h2{margin:0 0 10px;font-size:1.15rem}
input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:0}
input[type=color]{padding:0;width:44px;height:34px;cursor:pointer}
input[type=number]{width:100px}
button{font:inherit;padding:7px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:#e6e3d8;color:var(--ink)}
button.x{background:none;color:#b3261e;padding:4px 8px}
button:focus-visible,input:focus-visible{outline:3px solid #f2b705;outline-offset:1px}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:700;color:var(--mut);font-size:.85rem}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:6px;border:1px solid #0003}
.dia{border-left:6px solid var(--acc);padding:8px 0 8px 12px;margin:14px 0}
.num{text-align:right}
tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
.vacio{color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding-right:2px}
.chip input{width:80px;border:0}
.tab{background:#e6e3d8;color:var(--ink);text-align:center;line-height:1.15;min-width:74px}
.tab.on{background:var(--acc);color:#fff}
.tab small{opacity:.85}
.fecha{font-size:1.35rem;font-weight:700;margin-bottom:10px}
.fecha::first-letter{text-transform:uppercase}
button:disabled{opacity:.4;cursor:default}
[hidden]{display:none!important}
.marca{display:flex;align-items:center;gap:14px;margin-bottom:6px}
#logo{height:68px;width:auto}
.logo-fb{height:68px;min-width:68px;padding:0 12px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:1.2rem;letter-spacing:1px}
.inst{font-weight:700;letter-spacing:2px;color:var(--acc)}
.volver{margin-top:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:16px 0}
.card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:4px;font-size:1.1rem}
.card span{color:var(--mut);font-size:.9rem}
.card:hover{border-color:var(--acc)}
header{max-width:none;margin:0;padding:16px max(20px,calc((100% - 1100px)/2));background:var(--acc);color:#fff}
header #estado{color:#c9d5f5}
header .inst{color:#fff}
header .logo-fb{background:#fff;color:var(--acc)}
header #logo{background:#fff;border-radius:8px;padding:4px}
.card{border-top:5px solid var(--acc)}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bloque{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
#estado:empty{display:none}
header{border-bottom:5px solid var(--fl)}
header #estado{color:#e5e5e5}
header .inst{color:var(--fl)}
header #logo{height:76px}
.dia{border-left-color:var(--fl)}
.card{border-top-color:var(--fl)}
.tab.on{background:var(--acc);color:#fff;box-shadow:inset 0 -4px 0 var(--fl)}
</style>
</head>

      <div class="inst">ISRL</div>
      <h1>Semana de la Matemática</h1>
    </div>
  </div>
  <div id="estado"></div>
</header>
<main>
  <div id="v-inicio">
  <section>
    <div class="fila" style="justify-content:space-between">
      <h2 style="margin:0">Día y juego</h2>
      <button id="addDia" class="sec">Agregar día</button>
    </div>
    <div id="tabs" class="fila" style="margin-top:10px"></div>
    <div id="dias"></div>
  </section>

    <div class="cards">
      <button class="card" data-ir="cursos"><strong>Cursos</strong><span id="cnK"></span></button>
      <button class="card" data-ir="colores"><strong>Colores</strong><span id="cnC"></span></button>
      <button class="card" data-ir="totales"><strong>Totales</strong><span id="cnT"></span></button>
    </div>
  </div>

  <div id="v-cursos" hidden>
    <button class="sec volver" data-ir="inicio">‹ Volver</button>
  <section>
    <h2>Cursos</h2>
    <div class="fila">
      <label>Desde <input id="kDe" type="number" min="1" max="12" value="1"></label>
      <label>hasta <input id="kHa" type="number" min="1" max="12" value="5"></label>
      <label>Divisiones <input id="kDiv" value="A,B" style="width:110px"></label>
      <button id="kGen">Generar cursos</button>
    </div>
    <div class="fila" style="margin-top:8px">
      <input id="kUno" placeholder="Curso suelto (ej. 5°)" aria-label="Curso suelto">
      <button id="kAdd" class="sec">Agregar curso</button>
    </div>
    <div id="chips" class="chips"></div>
  </section>
  </div>

  <div id="v-colores" hidden>
    <button class="sec volver" data-ir="inicio">‹ Volver</button>
  <section>
    <h2>Colores (equipos)</h2>
    <div class="fila">
      <input id="cCant" type="number" min="1" max="30" value="2" aria-label="Cantidad de colores">
      <button id="cBtn">Agregar colores</button>
    </div>
    <div class="scroll"><table id="tCol" style="margin-top:8px"></table></div>
  </section>
  </div>

  <div id="v-totales" hidden>
    <button class="sec volver" data-ir="inicio">‹ Volver</button>
  <section>
    <div class="fila" style="justify-content:space-between">
      <h2 style="margin:0">Totales</h2>
      <button id="xls">Descargar Excel</button>
    </div>
    <div class="scroll"><table id="tTot"></table></div>
    <h2 style="margin-top:18px">Detalle por color</h2>
    <div id="tDet" class="det"></div>
    <h2 style="margin-top:18px">Posiciones por color</h2>
    <div class="scroll"><table id="tPos"></table></div>
  </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
/* ============ PEGÁ ACÁ TU CONFIGURACIÓN DE FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyB2LEUZEXczI4qKsHk1bn9m-mh1HVeuLVk",
  authDomain: "dia-de-la-matematica.firebaseapp.com",
  projectId: "dia-de-la-matematica",
  storageBucket: "dia-de-la-matematica.firebasestorage.app",
  messagingSenderId: "877331460191",
  appId: "1:877331460191:web:b1cc469a0b60c15da4ebea",
  measurementId: "G-M5CL3XWNES"
};
/* =============================================================== */

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const r2 = n => Math.round(n * 100) / 100;
const PAL = [["Azul","#1e88e5"],["Verde","#43a047"],["Rojo","#e53935"],["Amarillo","#fdd835"],["Naranja","#fb8c00"],
             ["Violeta","#8e24aa"],["Celeste","#29b6f6"],["Rosa","#ec407a"],["Marrón","#6d4c41"],["Gris","#757575"]];

let S = { colores: [], cursos: [], dias: [] };
let saveRemote = null;
const norm = () => { S.colores = S.colores || []; S.cursos = S.cursos || []; S.dias = S.dias || []; S.dias.forEach(d => d.p = d.p || {}); };
try { const l = localStorage.getItem("semana-mate-v2"); if (l) S = JSON.parse(l); norm(); } catch (e) {}

function guardar() {
  try { localStorage.setItem("semana-mate-v2", JSON.stringify(S)); } catch (e) {}
  if (saveRemote) saveRemote(JSON.parse(JSON.stringify(S)));
}

/* ---------- cálculos ---------- */
const key = (c, k) => c.id + "_" + k.id;
const val = (d, c, k) => Number(d.p[key(c, k)]) || 0;
const totCK = (c, k) => r2(S.dias.reduce((a, d) => a + val(d, c, k), 0));   // un curso dentro de un color
const totC = c => r2(S.cursos.reduce((a, k) => a + totCK(c, k), 0));       // todo un color
const totDC = (d, c) => r2(S.cursos.reduce((a, k) => a + val(d, c, k), 0)); // un color en un día
const dot = c => `<span class="dot" style="background:${c.color}"></span>`;

/* ---------- pantalla ---------- */
function renderColores() {
  $("#tCol").innerHTML = S.colores.length
    ? `<tr><th>Nombre</th><th>Color</th><th></th></tr>` + S.colores.map(c => `
      <tr><td><input data-c="${c.id}" data-f="nombre" value="${esc(c.nombre)}" aria-label="Nombre del color"></td>
      <td><input type="color" data-c="${c.id}" data-f="color" value="${c.color}" aria-label="Color"></td>
      <td><button class="x" data-dc="${c.id}">Quitar</button></td></tr>`).join("")
    : `<tr><td class="vacio">Agregá los colores que participan.</td></tr>`;
}
function renderCursos() {
  $("#chips").innerHTML = S.cursos.length
    ? S.cursos.map(k => `<span class="chip"><input data-k="${k.id}" value="${esc(k.nombre)}" aria-label="Curso"><button class="x" data-dk="${k.id}" aria-label="Quitar curso">×</button></span>`).join("")
    : `<span class="vacio">Generá los cursos (por ejemplo de 1° a 5° con divisiones A,B).</span>`;
}
let cur = 0; // día que se está viendo (paginado)
const fmtLarga = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : "Sin fecha";
const fmtCorta = iso => iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) : "";
function renderTabs() {
  $("#tabs").innerHTML = S.dias.map((d, i) => `<button class="tab${i === cur ? " on" : ""}" data-go="${i}">${esc(d.nombre)}${d.fecha ? "<br><small>" + fmtCorta(d.fecha) + "</small>" : ""}</button>`).join("");
}
function renderDias() {
  if (cur > S.dias.length - 1) cur = S.dias.length - 1;
  if (cur < 0) cur = 0;
  renderTabs();
  const d = S.dias[cur], cs = S.colores;
  if (!d) { $("#dias").innerHTML = `<p class="vacio">Agregá el primer día para cargar la fecha, el juego y los puntajes.</p>`; return; }
  $("#dias").innerHTML = `
    <div class="dia">
      <div class="fecha" id="fh">${esc(fmtLarga(d.fecha))}</div>
      ${(!cs.length || !S.cursos.length) ? `<p class="vacio">Para cargar puntajes, primero agregá los cursos y después los colores desde las cards de abajo.</p>` : ""}
      <div class="fila">
        <input data-d="${d.id}" data-f="nombre" value="${esc(d.nombre)}" placeholder="Día (ej. Lunes)" aria-label="Nombre del día" style="width:120px">
        <input type="date" data-d="${d.id}" data-f="fecha" value="${d.fecha || ""}" aria-label="Fecha">
        <input data-d="${d.id}" data-f="juego" value="${esc(d.juego)}" placeholder="Título del juego" aria-label="Juego" style="flex:1;min-width:160px">
        <button class="x" data-dd="${d.id}">Quitar día</button>
      </div>
      <div class="scroll"><table>
        <tr><th>Curso</th>${cs.map(c => `<th>${dot(c)}${esc(c.nombre)}</th>`).join("")}</tr>
        ${S.cursos.map(k => `<tr><td>${esc(k.nombre)}</td>${cs.map(c => `<td><input type="number" step="0.01" data-d="${d.id}" data-c="${c.id}" data-k="${k.id}" value="${d.p[key(c, k)] ?? ""}" aria-label="${esc(k.nombre)} ${esc(c.nombre)}"></td>`).join("")}</tr>`).join("")}
        <tr class="sum"><td>Total del día</td>${cs.map(c => `<td class="num" id="dt_${d.id}_${c.id}">${totDC(d, c)}</td>`).join("")}</tr>
      </table></div>
      <div class="fila" style="justify-content:space-between;margin-top:12px">
        <button class="sec" data-go="${cur - 1}" ${cur === 0 ? "disabled" : ""}>‹ Día anterior</button>
        <button class="sec" data-go="${cur + 1}" ${cur === S.dias.length - 1 ? "disabled" : ""}>Día siguiente ›</button>
      </div>
    </div>`;
}
function totales() { totalesTablas(); renderCards(); }
function renderCards() {
  $("#cnC").textContent = S.colores.length + (S.colores.length === 1 ? " color" : " colores");
  $("#cnK").textContent = S.cursos.length + (S.cursos.length === 1 ? " curso" : " cursos");
  const top = [...S.colores].sort((a, b) => totC(b) - totC(a))[0];
  $("#cnT").textContent = top && totC(top) > 0 ? "Va primero: " + top.nombre + " (" + totC(top) + ")" : "Sin puntajes todavía";
}
function ir(v) {
  ["inicio", "colores", "cursos", "totales"].forEach(x => $("#v-" + x).hidden = x !== v);
  render(); window.scrollTo(0, 0);
}
function detalle() {
  const cs = S.colores;
  $("#tDet").innerHTML = cs.length && S.cursos.length ? cs.map(c => `
    <div class="bloque" style="border-top:6px solid ${c.color}">
      <strong>${esc(c.nombre)}</strong>
      <table>
        ${S.cursos.map(k => `<tr><td>${esc(k.nombre)}</td><td class="num">${totCK(c, k)}</td></tr>`).join("")}
        <tr class="sum"><td>Total general</td><td class="num">${totC(c)}</td></tr>
      </table>
    </div>`).join("") : `<span class="vacio">Sin datos todavía.</span>`;
}
function totalesTablas() {
  detalle();
  const cs = S.colores;
  $("#tTot").innerHTML = cs.length && S.cursos.length
    ? `<tr><th>Curso</th>${cs.map(c => `<th>${dot(c)}${esc(c.nombre)}</th>`).join("")}</tr>` +
      S.cursos.map(k => `<tr><td>${esc(k.nombre)}</td>${cs.map(c => `<td class="num">${totCK(c, k)}</td>`).join("")}</tr>`).join("") +
      `<tr class="sum"><td>TOTAL GENERAL</td>${cs.map(c => `<td class="num">${totC(c)}</td>`).join("")}</tr>`
    : `<tr><td class="vacio">Sin datos todavía.</td></tr>`;
  const pos = [...cs].sort((a, b) => totC(b) - totC(a));
  $("#tPos").innerHTML = cs.length
    ? `<tr><th>Puesto</th><th>Color</th><th>Total</th></tr>` + pos.map((c, i) => `<tr><td>${i + 1}°</td><td>${dot(c)}${esc(c.nombre)}</td><td class="num">${totC(c)}</td></tr>`).join("")
    : "";
}
function render() { renderColores(); renderCursos(); renderDias(); totales(); }

/* ---------- acciones ---------- */
$("#cBtn").onclick = () => {
  const n = Math.min(30, parseInt($("#cCant").value) || 0);
  for (let i = 0; i < n; i++) {
    const idx = S.colores.length, p = PAL[idx % PAL.length];
    S.colores.push({ id: uid(), nombre: p[0] + (idx >= PAL.length ? " " + (Math.floor(idx / PAL.length) + 1) : ""), color: p[1] });
  }
  guardar(); render();
};
$("#kGen").onclick = () => {
  const a = parseInt($("#kDe").value) || 1, b = parseInt($("#kHa").value) || a;
  const divs = $("#kDiv").value.split(",").map(s => s.trim()).filter(Boolean);
  for (let y = a; y <= b; y++)
    (divs.length ? divs.map(x => y + "°" + x) : [y + "°"]).forEach(n => { if (!S.cursos.some(k => k.nombre === n)) S.cursos.push({ id: uid(), nombre: n }); });
  guardar(); render();
};
$("#kAdd").onclick = () => {
  const n = $("#kUno").value.trim();
  if (n && !S.cursos.some(k => k.nombre === n)) { S.cursos.push({ id: uid(), nombre: n }); $("#kUno").value = ""; guardar(); render(); }
};
const sig = iso => {
  const t = iso ? new Date(iso + "T00:00:00") : new Date();
  if (iso) t.setDate(t.getDate() + 1);
  while (t.getDay() === 0 || t.getDay() === 6) t.setDate(t.getDate() + 1);
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
};
$("#addDia").onclick = () => {
  const ult = S.dias[S.dias.length - 1];
  S.dias.push({ id: uid(), nombre: "Día " + (S.dias.length + 1), fecha: sig(ult && ult.fecha), juego: "", p: {} });
  cur = S.dias.length - 1; guardar(); render();
};

document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.k && el.dataset.d) {                       // puntaje
    const d = S.dias.find(x => x.id === el.dataset.d), c = S.colores.find(x => x.id === el.dataset.c), k = S.cursos.find(x => x.id === el.dataset.k);
    if (el.value === "") delete d.p[key(c, k)]; else d.p[key(c, k)] = r2(parseFloat(el.value));
    guardar(); S.colores.forEach(cc => { const t = $(`#dt_${d.id}_${cc.id}`); if (t) t.textContent = totDC(d, cc); }); totales();
  } else if (el.dataset.c) { S.colores.find(x => x.id === el.dataset.c)[el.dataset.f] = el.value; guardar(); render(); }
  else if (el.dataset.k) { S.cursos.find(x => x.id === el.dataset.k).nombre = el.value; guardar(); render(); }
  else if (el.dataset.d) { S.dias.find(x => x.id === el.dataset.d)[el.dataset.f] = el.value; if (el.dataset.f === "fecha") $("#fh").textContent = fmtLarga(el.value); guardar(); renderTabs(); totales(); }
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.go !== undefined) { cur = +b.dataset.go; renderDias(); return; }
  if (b.dataset.ir) { ir(b.dataset.ir); return; }
  if (b.dataset.dc && confirm("¿Quitar este color y todos sus puntajes?")) { S.colores = S.colores.filter(c => c.id !== b.dataset.dc); guardar(); render(); }
  if (b.dataset.dk && confirm("¿Quitar este curso y sus puntajes?")) { S.cursos = S.cursos.filter(k => k.id !== b.dataset.dk); guardar(); render(); }
  if (b.dataset.dd && confirm("¿Quitar este día?")) { S.dias = S.dias.filter(d => d.id !== b.dataset.dd); cur = Math.max(0, cur - 1); guardar(); render(); }
});

/* ---------- Excel ---------- */
$("#xls").onclick = () => {
  if (!S.colores.length || !S.cursos.length) return alert("Primero cargá los cursos y después los colores.");
  const head = ["Curso", ...S.colores.map(c => c.nombre)];
  const fecha = f => f ? f.split("-").reverse().join("/") : "";
  const rows = [["ISRL - Semana de la Matemática"], []];
  // 1) cada día, uno debajo del otro
  S.dias.forEach(d => {
    rows.push([[d.nombre, fecha(d.fecha), d.juego].filter(Boolean).join(" - ")], head);
    S.cursos.forEach(k => rows.push([k.nombre, ...S.colores.map(c => d.p[key(c, k)] ?? "")]));
    rows.push(["Total del día", ...S.colores.map(c => totDC(d, c))], []);
  });
  // 2) totales por curso y color, con el total general
  rows.push(["TOTALES POR CURSO Y COLOR"], head);
  S.cursos.forEach(k => rows.push([k.nombre, ...S.colores.map(c => totCK(c, k))]));
  rows.push(["TOTAL GENERAL", ...S.colores.map(c => totC(c))], []);
  // 3) posiciones
  rows.push(["POSICIONES"], ["Puesto", "Color", "Total"]);
  [...S.colores].sort((a, b) => totC(b) - totC(a)).forEach((c, i) => rows.push([i + 1, c.nombre, totC(c)]));
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 34 }, ...S.colores.map(() => ({ wch: 14 }))];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Semana de la Matemática");
  XLSX.writeFile(wb, "ISRL-semana-de-la-matematica.xlsx");
};

/* ---------- Firebase (si está configurado) ---------- */
async function iniciarFirebase() {
  if (!firebaseConfig.apiKey || firebaseConfig.apiKey === "PEGAR_AQUI") {
    $("#estado").textContent = "";
    return;
  }
  try {
    const base = "https://www.gstatic.com/firebasejs/10.12.2/";
    const { initializeApp } = await import(base + "firebase-app.js");
    const { getFirestore, doc, setDoc, onSnapshot } = await import(base + "firebase-firestore.js");
    const ref = doc(getFirestore(initializeApp(firebaseConfig)), "semana", "datos");
    saveRemote = data => setDoc(ref, data).catch(() => { $("#estado").textContent = "No se pudo guardar en Firebase. Revisá las reglas de Firestore."; });
    onSnapshot(ref, snap => {
      if (snap.metadata.hasPendingWrites) return;
      if (snap.exists() && snap.data().colores) {
        S = snap.data(); norm();
        if (!document.activeElement || !document.activeElement.matches("input")) render(); else totales();
      } else if (S.colores.length || S.cursos.length || S.dias.length) guardar();
      $("#estado").textContent = "";
    }, () => { $("#estado").textContent = "Error de conexión con Firebase. Revisá la configuración y las reglas."; });
  } catch (e) { $("#estado").textContent = "No se pudo cargar Firebase. Se usa el modo local."; }
}

render();
iniciarFirebase();
</script>
</body>
